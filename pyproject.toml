[project]
name = "ece315"
version = "0.1.0"
description = "Homework assignments and projects for ECE315 2026"
readme = "README.md"
authors = [{ name = "William Jeffreys", email = "wjeffreys96@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "intel-cmplr-lib-rt>=2026.1.2",
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.3",
    "pyside6>=6.11.2",
]

[project.scripts]
ece315 = "ece315:main"
hw1 = "ece315.hw1:main"
numba_test = "numba_test:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "standard"
reportAttributeAccessIssue = false
